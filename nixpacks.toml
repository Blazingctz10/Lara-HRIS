[phases.setup]
nixPkgs = [
  'php83',
  'php83Extensions.pdo',
  'php83Extensions.pdo_sqlite',
  'php83Extensions.sqlite3',
  'php83Extensions.intl',
  'php83Extensions.gd',
  'php83Extensions.zip',
  'php83Extensions.mbstring',
  'php83Extensions.xml',
  'php83Extensions.bcmath',
  'php83Extensions.curl',
  'php83Packages.composer',
  'nodejs_20'
]

[phases.install]
cmds = [
  'composer install --optimize-autoloader --ignore-platform-reqs --no-interaction',
  'npm install'
]

[phases.build]
cmds = [
  'npm run build',
  'php artisan storage:link || true'
]

[start]
cmd = 'mkdir -p storage/framework/{sessions,views,cache} database && chmod -R 777 storage bootstrap/cache database && touch database/database.sqlite && chmod 666 database/database.sqlite && php artisan migrate --force && (php artisan db:seed --force || true) && PHP_CLI_SERVER_WORKERS=4 php artisan serve --host=0.0.0.0 --port=$PORT'
