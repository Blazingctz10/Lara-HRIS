<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Koneksi Terputus — Core HRIS PT BPR Banda Raya</title>
    <link rel="icon" type="image/png" href="/images/logo-bpr-vertical.png">
    <style>
        :root {
            color-scheme: light dark;
            --bg: #EBF1ED;
            --card: #F9FBFA;
            --border: #D5E0D9;
            --text: #0F1A14;
            --muted: #55695E;
            --primary: #0E6838;
            --on-primary: #FFFFFF;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0F1115;
                --card: #181C23;
                --border: rgba(255, 255, 255, 0.09);
                --text: #F3F4F6;
                --muted: #9CA3AF;
                --primary: #4ADE80;
                --on-primary: #052E16;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        .card {
            max-width: 420px;
            width: 100%;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2rem;
            text-align: center;
        }
        .logo {
            width: 52px;
            height: 52px;
            margin: 0 auto 1rem;
            display: block;
            object-fit: contain;
        }
        h1 {
            margin: 0 0 0.5rem;
            font-size: 1.25rem;
            font-weight: 800;
        }
        p {
            margin: 0 0 1.5rem;
            font-size: 0.9rem;
            line-height: 1.55;
            color: var(--muted);
        }
        button {
            appearance: none;
            border: none;
            border-radius: 9999px;
            background: var(--primary);
            color: var(--on-primary);
            font-weight: 700;
            font-size: 0.9rem;
            padding: 0.7rem 1.5rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main class="card">
        <img src="/images/logo-bpr-horizontal.png" alt="BPR Banda Raya" class="logo">
        <h1>Koneksi Terputus</h1>
        <p>Perangkat Anda sedang offline atau belum terhubung ke jaringan HRIS PT BPR Banda Raya. Periksa koneksi internet/Wi-Fi Anda lalu coba lagi.</p>
        <button type="button" onclick="window.location.reload()">Muat Ulang Halaman</button>
    </main>
</body>
</html>
