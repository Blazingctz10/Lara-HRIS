<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 110 400 240" width="100%" height="100%">
  <defs>
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- ICON GROUP -->
  <g transform="translate(195, 115)" filter="url(#subtle-shadow)">
    <!-- Orange Background Flap -->
    <path d="M 75 8 L 88 12 L 95 118 L 10 118 L 82 120 Z" fill="#F37A20" />
    <path d="M 72 10 L 84 14 L 92 122 L 72 118 Z" fill="#E06912" />

    <!-- Green Front Book / Cover -->
    <path d="M 2 18 L 74 2 L 80 114 L 18 124 Z" fill="#15803d" />
    
    <!-- White Dashed Stitching Border -->
    <path d="M 6 22 L 70 8 L 76 110 L 20 120 Z" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="2" 
          stroke-dasharray="4, 3" 
          stroke-linecap="round" 
          opacity="0.95" />

    <!-- Golden Yellow Ribbon / Emblem Accent -->
    <path d="M 68 40 C 78 40, 88 44, 88 50 C 88 56, 75 58, 68 58 C 76 60, 89 64, 89 74 C 89 82, 74 86, 60 84 L 62 76 C 70 78, 80 76, 80 72 C 80 66, 68 66, 60 63 L 60 55 C 68 55, 78 54, 78 49 C 78 45, 70 44, 65 44 Z" 
          fill="#FDB813" />

    <!-- Inner White Details -->
    <circle cx="67" cy="56" r="2.5" fill="#FFFFFF" opacity="0.95" />
    <path d="M 63 60 C 66 58, 70 60, 71 63" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.95"/>
  </g>

  <!-- TEXT: BANK PEREKONOMIAN RAKYAT -->
  <text x="250" y="278" 
        text-anchor="middle" 
        fill="#22c55e" 
        font-family="'Segoe UI', ui-sans-serif, system-ui, -apple-system, sans-serif" 
        font-weight="800" 
        font-size="20.5" 
        letter-spacing="1.5">
    BANK PEREKONOMIAN RAKYAT
  </text>

  <!-- TEXT: BANDA RAYA -->
  <text x="250" y="332" 
        text-anchor="middle" 
        fill="#F37A20" 
        font-family="'Georgia', 'Times New Roman', 'Playfair Display', serif" 
        font-weight="900" 
        font-size="50" 
        letter-spacing="3">
    BANDA RAYA
  </text>
</svg>
